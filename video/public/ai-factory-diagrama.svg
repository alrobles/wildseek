<text x="562" y="464" fill="#f85149" font-size="11" text-anchor="middle">bounded retry (1x)</text>

<!-- Cost gate -->
<line x1="700" y1="304" x2="700" y2="338" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3"/>
