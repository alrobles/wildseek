<!-- Criticality -->
<line x1="890" y1="304" x2="890" y2="318" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="805" y="320" width="170" height="76" rx="8" fill="#141b30" stroke="#8b949e" stroke-dasharray="5,3"/>
<text x="890" y="340" fill="#ffffff" font-size="11" text-anchor="middle">model refit → PR</text>
<text x="890" y="358" fill="#ffffff" font-size="11" text-anchor="middle">Δ data &gt; 5% → PR</text>
<text x="890" y="376" fill="#3fb950" font-size="11" text-anchor="middle">refresh only → direct</text>

<!-- Footer -->
<text x="20" y="540" fill="#8b949e" font-size="12">Quorum: code + security always approve, ≥3/4 total. The LLM approver reads the 4 verdicts and emits approve / reject / note. All output lands in qa_report.json + manifest (auditable, traceable, fixable).</text>
<text x="20" y="560" fill="#8b949e" font-size="12">v2 changes: judicious approver (not just AND) · cost gate with veto · criticality table in Brain · honest reviewers (3 gates + 1 judge) · TDD per stage or off the diagram.</text>
</svg>