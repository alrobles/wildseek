name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pandas numpy duckdb pyarrow fastapi httpx requests scikit-learn
      - run: python -m pytest tests/ -q
